
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum - Scene Perkenalan Diri</title>

  <!-- Library A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- 1. LANGIT -->
    <a-sky color="#A7D8FF"></a-sky>

    <!-- 2. LANTAI -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="12"
      height="12"
      color="#DCE6F1">
    </a-plane>

    <!-- 3. KUBUS BIRU -->
    <a-box
      position="-2 0.5 -3"
      rotation="0 45 0"
      width="1"
      height="1"
      depth="1"
      color="#2563EB">
    </a-box>

    <!-- 4. BOLA ORANYE -->
    <a-sphere
      position="0 0.65 -3"
      radius="0.65"
      color="#F59E0B">
    </a-sphere>

    <!-- 5. SILINDER HIJAU -->
    <a-cylinder
      position="2 0.75 -3"
      radius="0.45"
      height="1.5"
      color="#10B981">
    </a-cylinder>

    <!-- 6. CINCIN MERAH MUDA DENGAN ANIMASI -->
    <a-torus
      position="0 1.8 -3"
      radius="0.4"
      radius-tubular="0.08"
      color="#EC4899"
      animation="property: rotation;
                 to: 0 360 0;
                 loop: true;
                 dur: 6000;
                 easing: linear">
    </a-torus>

    <!-- 7. JUDUL PERKENALAN DIRI -->
    <a-text
      value="PERKENALAN DIRI"
      position="0 3.6 -3"
      align="center"
      color="#1E3A8A"
      width="6">
    </a-text>

    <!-- 8. NAMA -->
    <a-text
      value="Nama: Henni Suriani Sihombing"
      position="0 3.2 -3"
      align="center"
      color="#222222"
      width="5">
    </a-text>

    <!-- 9. NIM -->
    <a-text
      value="NIM: 2309020336"
      position="0 2.8 -3"
      align="center"
      color="#222222"
      width="5">
    </a-text>

    <!-- 10. KAMERA -->
    <a-camera position="0 1.6 6"></a-camera>

  </a-scene>
</body>
</html>
